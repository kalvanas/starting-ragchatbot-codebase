<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Checkers Tutor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>Checkers Tutor</h1>
      <p>Play against AI &amp; get coached by Claude after every move</p>
    </header>

    <!-- Main layout -->
    <div class="main">

      <!-- Left: board + controls -->
      <section class="board-section">
        <div class="board-wrap">
          <!-- Row labels left -->
          <div class="labels-col">
            <span>0</span><span>1</span><span>2</span><span>3</span>
            <span>4</span><span>5</span><span>6</span><span>7</span>
          </div>

          <div id="board" class="board"></div>

          <!-- Col labels bottom -->
        </div>
        <div class="col-labels">
          <span>0</span><span>1</span><span>2</span><span>3</span>
          <span>4</span><span>5</span><span>6</span><span>7</span>
        </div>

        <!-- Status bar -->
        <div id="statusBar" class="status-bar">Click "New Game" to start</div>

        <!-- Controls -->
        <div class="controls">
          <button id="newGameBtn" class="btn btn-primary">New Game</button>
          <button id="hintBtn"    class="btn btn-secondary" disabled>Hint</button>
          <label class="diff-label">
            Difficulty:
            <select id="difficulty">
              <option value="easy">Easy</option>
              <option value="medium" selected>Medium</option>
              <option value="hard">Hard</option>
            </select>
          </label>
        </div>

        <!-- Legend -->
        <div class="legend">
          <span class="legend-piece red-swatch"></span> You (red, move UP)
          &nbsp;&nbsp;
          <span class="legend-piece black-swatch"></span> AI (black, move DOWN)
        </div>
      </section>

      <!-- Right: tutor chat -->
      <section class="chat-section">
        <div class="chat-header">AI Coach</div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Ask a checkers question…" autocomplete="off" />
          <button id="sendBtn" class="btn btn-primary">Ask</button>
        </div>
      </section>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
